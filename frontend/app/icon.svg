<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Datum Break">
  <rect x="4" y="4" width="92" height="92" rx="21" fill="#051125"/>
  <!-- Breakline, small cut: ticks removed and stroke opened to 10, because a
       favicon renders at 16-32px where the primary cut's 7-wide stroke lands
       near 1px and its staff ticks close up against the runs. Mirrors the
       small branch of LogoMark in components/ui/Logo.tsx. -->
  <path d="M12 30 H59 V70 H88" fill="none" stroke="#FFFFFF" stroke-width="10"
        stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="10"/>
</svg>
