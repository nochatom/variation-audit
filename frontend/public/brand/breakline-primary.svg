<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Breakline mark">
  <title>Breakline mark — primary cut</title>
  <!-- REFERENCE COPY ONLY. Nothing in the app loads this file: the mark is
       rendered from vector paths inside components/ui/Logo.tsx. Editing this
       file does NOT change the app. Keep the geometry in sync with LogoMark.

       Riser descends left to right; runs deliberately unequal at 46 : 28 so
       the mark reads as a change in level, not a stair tread. Use at 24px and
       above; below that use breakline-small.svg. Colour follows currentColor. -->
  <g fill="none" stroke="currentColor" stroke-width="7"
     stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10">
    <path d="M13 30 H59 V70 H87"/>
    <path d="M13 20 V40"/>
    <path d="M87 60 V80"/>
  </g>
</svg>
