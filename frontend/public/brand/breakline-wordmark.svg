  <title>Datum Break — wordmark</title>
  <!-- REFERENCE COPY ONLY. Nothing in the app loads this file: the wordmark is
       rendered from vector paths inside components/ui/Wordmark.tsx. Editing
       this file does NOT change the app. Keep it in sync with that component.

       Constructed letterforms drawn from the Breakline mark's geometry rather
       than set in a typeface: one monolinear stroke weight, square terminals,
       mitred joins, diagonals only where a letter cannot read without one.
